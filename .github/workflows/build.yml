name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: aurora-launcher-${{ github.sha }}
          path: release-build/
      - name: Generate latest.yml
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $exe = Get-ChildItem release-build/*.exe | Where-Object { $_.Name -like '*Setup*' } | Select-Object -First 1
          $bytes = [System.IO.File]::ReadAllBytes($exe.FullName)
          $sha = [System.Security.Cryptography.SHA512]::Create().ComputeHash($bytes)
          $b64 = [Convert]::ToBase64String($sha)
          $date = (Get-Date).ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $tag = "${{ github.ref_name }}" -replace '^v'
          @"
          version: $tag
          path: $($exe.Name)
          sha512: $b64
          releaseDate: $date
          "@ | Out-File -FilePath release-build/latest.yml -Encoding ASCII
      - name: Delete existing release if any
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: gh release delete ${{ github.ref_name }} --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} release-build/*.exe release-build/*.yml --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
